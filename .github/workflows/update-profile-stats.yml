name: Update public profile statistics

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile-stats.yml'
      - 'ascii-profile/profile.json'
      - 'ascii-profile/*.py'
      - 'ascii-profile/gallery.template.html'
      - 'ascii-profile/requirements-animation.txt'

permissions:
  contents: read

concurrency:
  group: public-profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'Ranj101/Ranj101' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out the latest profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ascii-profile/requirements-animation.txt

      - name: Install the renderer dependency
        run: python -m pip install -r ascii-profile/requirements-animation.txt

      - name: Test the public-data boundary
        run: python -m unittest discover -s ascii-profile -p 'test_stats.py'

      - name: Refresh public statistics
        id: statistics
        shell: bash
        run: |
          python ascii-profile/update_stats.py
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] || ! git diff --quiet -- ascii-profile/profile.json; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "animation=true" >> "$GITHUB_OUTPUT"
          else
            echo "animation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the geometry animation after source changes
        if: steps.statistics.outputs.animation == 'true'
        run: python ascii-profile/animate.py

      - name: Refresh the profile card, README, and gallery
        if: steps.statistics.outputs.render == 'true'
        run: python ascii-profile/generate.py --readme README.md

      - name: Verify the generated profile
        if: steps.statistics.outputs.render == 'true'
        run: |
          python -m unittest discover -s ascii-profile -p 'test_*.py'
          git diff --check

      - name: Commit changed statistics and images
        if: steps.statistics.outputs.render == 'true'
        shell: bash
        run: |
          git add -- README.md ascii-profile/profile.json ascii-profile/assets ascii-profile/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update public profile statistics'
          git push origin HEAD:main
